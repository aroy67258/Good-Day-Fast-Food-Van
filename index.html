<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚐</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141210" />
    <title>Good Day Fast Food Van | Fresh Vegetarian Street Food</title>
    <meta name="description" content="Authentic 100% pure vegetarian Indian street food - hand-crafted burgers, wok-tossed chowmein, steamed momos, rolls and spicy starters delivered straight to your hostel or campus location." />
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Good Day Fast Food Van | Fresh Vegetarian Street Food" />
    <meta property="og:description" content="Authentic 100% pure vegetarian Indian street food - hand-crafted burgers, wok-tossed chowmein, steamed momos, rolls and spicy starters." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/good-day-menu.jpg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#141210] text-[#FDFCFB] antialiased overflow-x-hidden selection:bg-[#F5A623] selection:text-white">
    <div id="root">
      <!-- Branded Zero-JS Loading Splash (Replaced immediately on React mount) -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #141210; color: #ffffff; font-family: 'Outfit', sans-serif; text-align: center; padding: 20px;">
        <div style="width: 80px; height: 80px; border-radius: 24px; background: linear-gradient(135deg, #C21807, #8B1414); border: 2px solid #F5A623; display: flex; align-items: center; justify-content: center; font-size: 38px; box-shadow: 0 10px 30px rgba(194, 24, 7, 0.4); margin-bottom: 24px;">
          🚐
        </div>
        <h1 style="font-size: 28px; font-weight: 900; letter-spacing: 2px; margin: 0; color: #FFFFFF; line-height: 1.2;">
          GOOD DAY
        </h1>
        <p style="font-size: 16px; font-weight: 800; letter-spacing: 3px; color: #F5A623; margin: 6px 0 16px 0; text-transform: uppercase;">
          FAST FOOD VAN
        </p>
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #4ADE80; background: rgba(21, 128, 61, 0.2); border: 1px solid rgba(74, 222, 128, 0.4); padding: 5px 14px; border-radius: 9999px; text-transform: uppercase; margin-bottom: 24px;">
          100% Pure Vegetarian Street Food
        </div>
        <!-- Warm pulsing loading progress bar -->
        <div style="width: 140px; height: 3px; background: rgba(255, 255, 255, 0.1); border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 45%; height: 100%; background: linear-gradient(90deg, #F5A623, #EF4444); border-radius: 9999px; animation: pulseLoading 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes pulseLoading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
